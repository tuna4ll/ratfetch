[package]
name = "ratfetch"
version = "0.2.0"
edition = "2021"
# Set by ratatui 0.30, which is the highest MSRV in the dependency tree.
rust-version = "1.88"
description = "A live, always-updating system fetch for the terminal"
authors = ["Tuna Kılıç <tuna33tuna06@gmail.com>"]
repository = "https://github.com/tuna4ll/ratfetch"
homepage = "https://github.com/tuna4ll/ratfetch"
license = "MIT"
readme = "README.md"
keywords = ["fetch", "tui", "system-info", "neofetch", "monitor"]
categories = ["command-line-utilities"]
# assets/ascii is compiled in by build.rs, so it has to ship with the crate.
include = ["src/**", "assets/**", "build.rs", "README.md", "LICENSE"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.2"
crossterm = "0.29"
dirs = "6.0"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
